name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxe dos scripts
        run: node --check src/logic.js && node --check src/app.js
      - name: Testes das regras
        # TZ fixo: os testes de data precisam valer em qualquer fuso.
        run: TZ=America/Sao_Paulo node --test "tests/**/*.test.js"
